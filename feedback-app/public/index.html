<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Feedback</title>
<style>
  :root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--bd:#e7e5e4;--ok:#15803d;--no:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#171412;--fg:#f5f5f4;--mut:#a8a29e;--card:#211e1c;--bd:#3a3532}}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px}
  h1{font-size:22px;margin:0 0 16px}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input,button,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
  #q{flex:1;min-width:200px}
  button{cursor:pointer}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0}
  .card h3{margin:0;font-size:17px}
  .url{color:var(--mut);font-size:13px;word-break:break-all}
  .ex{color:var(--mut);font-size:14px;margin:8px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .note{flex:1;min-width:160px}
  .ok.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .no.on{background:var(--no);color:#fff;border-color:var(--no)}
  .bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:12px 0}
  .err{color:var(--no)}
</style></head><body><main>
<h1>Search result feedback</h1>
<form id="f">
  <input id="q" placeholder="Enter a search query" required autofocus>
  <button>Search</button>
</form>
<form style="margin-top:8px"><input id="who" placeholder="Your name (optional)" style="width:200px"></form>
<div id="msg" class="bar"></div>
<div id="out"></div>
<div class="bar"><span id="count"></span><a href="/api/evaluations?format=csv">Download all evaluations (CSV)</a></div>
<script>
const $ = (id) => document.getElementById(id);
let ctx = null;
$("who").value = localStorage.getItem("who") || "";
$("who").oninput = () => localStorage.setItem("who", $("who").value);

const post = (u, b) => fetch(u, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(b)}).then(r => r.json());
const refreshCount = async () => {
  const rows = await (await fetch("/api/evaluations")).json();
  const rel = rows.filter(r => r.label === "relevant").length;
  $("count").textContent = `${rows.length} saved (${rel} relevant, ${rows.length - rel} not relevant)`;
};

function render() {
  $("out").innerHTML = "";
  for (const r of ctx.results) {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<h3></h3><div class="url"></div><div class="ex"></div>
      <div class="row"><button class="ok">👍 Relevant</button><button class="no">👎 Not relevant</button>
      <input class="note" placeholder="Optional note"></div>`;
    el.querySelector("h3").textContent = `${r.rank}. ${r.title}`;
    el.querySelector(".url").innerHTML = `<a target="_blank" rel="noopener"></a>`;
    const a = el.querySelector("a"); a.href = r.url; a.textContent = r.url;
    el.querySelector(".ex").textContent = (r.excerpts[0] || "").slice(0, 400);
    const ok = el.querySelector(".ok"), no = el.querySelector(".no"), note = el.querySelector(".note");
    note.value = r.note;
    const paint = () => { ok.classList.toggle("on", r.label === "relevant"); no.classList.toggle("on", r.label === "not_relevant"); };
    const save = async (label) => {
      r.label = label; r.note = note.value; paint();
      await post("/api/evaluations", {query: ctx.query, search_id: ctx.search_id, rank: r.rank, url: r.url,
        title: r.title, label, note: note.value, reviewer: $("who").value});
      refreshCount();
    };
    // clicking the active vote again clears it
    ok.onclick = () => save(r.label === "relevant" ? "cleared" : "relevant");
    no.onclick = () => save(r.label === "not_relevant" ? "cleared" : "not_relevant");
    note.onchange = () => r.label && r.label !== "cleared" && save(r.label);
    paint(); $("out").append(el);
  }
}

$("f").onsubmit = async (e) => {
  e.preventDefault();
  $("msg").className = "bar"; $("msg").textContent = "Searching…"; $("out").innerHTML = "";
  const d = await post("/api/search", {query: $("q").value});
  if (d.error) { $("msg").className = "bar err"; $("msg").textContent = d.error; return; }
  ctx = d;
  $("msg").textContent = d.demo ? "Demo mode: no PARALLEL_API_KEY set, showing placeholder results." : `${d.results.length} results`;
  render();
};
refreshCount();
</script></main></body></html>
