<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scouter Launch Film</title>
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 300; src: url(../fonts/SpaceGrotesk-300.woff) format("woff"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(../fonts/SpaceGrotesk-500.woff) format("woff"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(../fonts/SpaceGrotesk-700.woff) format("woff"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url(../fonts/InstrumentSerif-Regular.woff) format("woff"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../fonts/InstrumentSerif-Italic.woff) format("woff"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(../fonts/JetBrainsMono-400.woff) format("woff"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(../fonts/JetBrainsMono-700.woff) format("woff"); }
  html, body { margin: 0; height: 100%; background: #0b1d28; color: #cfe; font: 13px "JetBrains Mono", monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { width: min(100vw, calc((100vh - 60px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #000; cursor: pointer; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100vw - 32px, calc((100vh - 60px) * 16 / 9)); }
  input[type=range] { flex: 1; accent-color: #34d27a; }
  button { background: #34d27a; color: #08261a; border: 0; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; border-radius: 6px; }
  body.render .bar { display: none; }
  body.render { display: block; }
  body.render canvas { width: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">PLAY</button>
  <input id="scrub" type="range" min="0" max="767" value="0">
  <span id="tc">0.00s</span>
</div>
<audio id="music" src="dist/soundtrack.wav" preload="auto"></audio>
<script src="src/core.js"></script>
<script src="src/peri.js"></script>
<script src="src/scenes.js"></script>
<script src="src/ui.js"></script>
<script src="src/film.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const renderMode = params.has('render');
  if (renderMode) document.body.classList.add('render');
  await Promise.all([...document.fonts].map(f => f.load()));
  await document.fonts.ready;
  await P.load('assets/');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  Film.init();

  window.renderFrameAt = (frame, subs) => { Film.renderFrame(ctx, frame, subs); };
  window.READY = true;
  if (renderMode) return;

  const music = document.getElementById('music');
  const scrub = document.getElementById('scrub');
  const tc = document.getElementById('tc');
  const btn = document.getElementById('play');
  scrub.max = Film.frames - 1;
  let playing = false, start = 0, t = 0;
  function draw(frame) { Film.renderFrame(ctx, frame, 1); scrub.value = frame; tc.textContent = (frame / Film.FPS).toFixed(2) + 's'; }
  function loop(now) {
    if (!playing) return;
    t = music.readyState >= 2 && !music.paused ? music.currentTime : (now - start) / 1000;
    if (t >= Film.DUR) { t = 0; start = now; music.currentTime = 0; }
    draw(Math.min(Film.frames - 1, Math.floor(t * Film.FPS)));
    requestAnimationFrame(loop);
  }
  function toggle() {
    playing = !playing; btn.textContent = playing ? 'PAUSE' : 'PLAY';
    if (playing) { start = performance.now() - t * 1000; music.currentTime = t; music.play().catch(() => {}); requestAnimationFrame(loop); }
    else music.pause();
  }
  btn.onclick = toggle; canvas.onclick = toggle;
  scrub.oninput = () => { t = scrub.value / Film.FPS; music.currentTime = t; draw(+scrub.value); };
  draw(0);
})();
</script>
</body>
</html>
